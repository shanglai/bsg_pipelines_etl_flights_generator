    letra: C
    nombre: Aerovías Ajolote
    canal: mysql
    hubs: [TIJ, GDL]
    tasa_cancelacion: 0.02
    aeropuertos: [TIJ, GDL, MEX, CUL, HMO, MZT, SJD, PVR, ZIH, CUN, MTY, LAX, SFO,
                  LAS, PHX, DFW, LIM, SCL, GRU, BOG]
