    rutas_segundo_hub: [GDL, MTY, MID, MIA, JFK, ATL, BOG, PTY, HAV, SDQ, SJO, VSA]
  - codigo: JG
    letra: B
    nombre: Jaguar Air
    canal: sftp
    hubs: [MTY]
    tasa_cancelacion: 0.04
    aeropuertos: [MTY, MEX, GDL, CUN, TRC, CJS, TAM, QRO, BJX, HMO, CUL, IAH, DFW,
                  ORD, LAS, MIA, PVR, SJD]
