# Aerolíneas FICTICIAS del simulador. Los nombres y los códigos de dos letras se
# inventaron para el curso; si un código coincide con una asignación real de IATA,
# es casualidad y no representa a ninguna empresa.
aerolineas:
  - codigo: CQ
    letra: A
    nombre: Aerolíneas Colibrí
    canal: api
    hubs: [MEX, CUN]
    tasa_cancelacion: 0.03
    aeropuertos: [MEX, CUN, GDL, MTY, MID, OAX, VER, VSA, HUX, BJX, QRO, TIJ, CZM,
                  MIA, JFK, ORD, ATL, BOG, PTY, HAV, SDQ, SJO]
