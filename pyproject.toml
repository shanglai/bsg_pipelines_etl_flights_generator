[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-aerolineas"
version = "1.0.0"
description = "Simulador de tres aerolíneas ficticias para el proyecto final de Pipelines de Datos y ETL con Python (BSG Institute)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pymysql>=1.1",
  "cryptography>=42",
  "pyyaml>=6.0",
  "duckdb>=1.0",
  "pyarrow>=15",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
pruebas = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sim = "sim_aerolineas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
