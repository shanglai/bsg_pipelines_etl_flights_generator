name: Publicar imágenes del simulador
on:
  push:
    tags: ["v*"]          # se publica al crear una etiqueta como v1.0.0
  workflow_dispatch:       # o a mano desde la pestaña Actions

permissions:
  contents: read
  packages: write          # el GITHUB_TOKEN puede publicar en ghcr.io

jobs:
  publicar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - nombre: bsg-simulador-aerolineas
            contexto: .
          - nombre: bsg-simulador-sftp
            contexto: ./sftp
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shanglai/${{ matrix.nombre }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/shanglai/bsg_pipelines_etl_flights_generator
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
